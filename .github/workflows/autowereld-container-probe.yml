name: AutoWereld ephemeral container RSS probe (development only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'autowereld_container_probe.py'
      - '.github/workflows/autowereld-container-probe.yml'

permissions:
  contents: read

jobs:
  normal-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch one public RSS feed from native runner
        run: python3 autowereld_container_probe.py

  ephemeral-container:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Fetch same public RSS feed from short-lived container
        run: python3 autowereld_container_probe.py
