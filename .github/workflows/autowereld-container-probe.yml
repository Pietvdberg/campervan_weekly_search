name: AutoWereld ephemeral container RSS probe (development only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/campervan_search/autowereld_container_probe.py'
      - 'pyproject.toml'
      - '.github/workflows/autowereld-container-probe.yml'

permissions:
  contents: read

jobs:
  normal-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Fetch one public RSS feed from native runner
        run: python3 -m campervan_search.autowereld_container_probe

  ephemeral-container:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Fetch same public RSS feed from short-lived container
        run: python3 -m campervan_search.autowereld_container_probe
