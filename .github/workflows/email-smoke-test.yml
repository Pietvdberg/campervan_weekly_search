name: Gmail delivery smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose smoke-test report
        run: |
          printf 'Camper van pipeline smoke test. No vehicle search was performed.\n' > report.txt
      - name: Validate sender syntax
        run: python3 -m py_compile send_report.py
      - name: Verify development recipient guard
        run: python3 -m unittest -v test_mail_routing.py
      - name: Restore mail submission state on rerun
        if: github.run_attempt > 1
        uses: ./.github/actions/download-artifact
        with:
          name: mail-delivery-state-${{ github.run_id }}
          path: .
      - name: Send and verify Gmail
        env:
          MAIL_MODE: development
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 send_report.py report.txt
      - name: Preserve mail submission state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mail-delivery-state-${{ github.run_id }}
          path: mail_delivery_state.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
