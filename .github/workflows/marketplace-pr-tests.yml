name: Marketplace pull request tests
on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'src/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/**'
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          development: 'true'
      - name: Verify compilation and unit tests without live scraping
        run: |
          python3 -m black --check .
          python3 -m ruff check .
          python3 -m compileall -q src tests scripts
          python3 -m unittest discover -s tests -t . -v
      - name: Check production planner with real workflow metadata and no email
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_checks.py planner
      - name: Prepare artifact round-trip fixture
        run: |
          mkdir -p "$RUNNER_TEMP/camper-action-smoke/.search-state"
          printf '%s\n' '{"probe":"node24-artifact-roundtrip"}' > "$RUNNER_TEMP/camper-action-smoke/.search-state/history.json"
      - name: Upload hidden history fixture
        uses: actions/upload-artifact@v7
        with:
          name: action-runtime-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/camper-action-smoke/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Download and verify artifact integrity
        uses: ./.github/actions/download-artifact
        env:
          NODE_OPTIONS: --throw-deprecation
        with:
          name: action-runtime-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/camper-action-smoke-downloaded
      - name: Compare restored history fixture
        run: cmp "$RUNNER_TEMP/camper-action-smoke/.search-state/history.json" "$RUNNER_TEMP/camper-action-smoke-downloaded/.search-state/history.json"

  restore-artifact-across-jobs:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Restore hidden history in a different job
        uses: ./.github/actions/download-artifact
        env:
          NODE_OPTIONS: --throw-deprecation
        with:
          name: action-runtime-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/camper-history-restore
      - name: Verify restored history payload
        run: python3 scripts/ci_checks.py artifact

  wheel-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test the minimum supported Python version
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: ./.github/actions/setup-project
        with:
          development: 'true'
      - name: Run regressions on Python 3.11
        run: python3 -m unittest discover -s tests -t . -v
      - name: Build source distribution and wheel
        run: python3 -m build
      - name: Verify source archive contains offline test prerequisites
        run: python3 scripts/ci_checks.py sdist
      - name: Install wheel into an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/camper-wheel"
          "$RUNNER_TEMP/camper-wheel/bin/python" -m pip install --no-deps dist/*.whl
      - name: Check installed resources and commands outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ''
        run: |
          "$RUNNER_TEMP/camper-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed_package.py"
          "$RUNNER_TEMP/camper-wheel/bin/campervan-discover" --help
          "$RUNNER_TEMP/camper-wheel/bin/campervan-rdw" --help
