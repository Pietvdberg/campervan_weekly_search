name: Marketplace pull request tests
on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'dealer_registry.json'
      - 'variant_research.json'
      - 'scripts/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify compilation and unit tests without live scraping
        run: |
          python3 -m compileall -q .
          python3 -m unittest discover -v
