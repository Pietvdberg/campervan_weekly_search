name: Marketplace pull request tests
on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'dealer_registry.json'
      - 'variant_research.json'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify compilation and unit tests without live scraping
        run: |
          python3 -m compileall -q .
          python3 -m unittest discover -v
      - name: Prepare artifact round-trip fixture
        run: |
          mkdir -p "$RUNNER_TEMP/camper-action-smoke/.search-state"
          printf '%s\n' '{"probe":"node24-artifact-roundtrip"}' > "$RUNNER_TEMP/camper-action-smoke/.search-state/history.json"
      - name: Upload hidden history fixture
        uses: actions/upload-artifact@v7
        with:
          name: action-runtime-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/camper-action-smoke/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Download and verify artifact integrity
        uses: ./.github/actions/download-artifact
        env:
          NODE_OPTIONS: --throw-deprecation
        with:
          name: action-runtime-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/camper-action-smoke-downloaded
      - name: Compare restored history fixture
        run: cmp "$RUNNER_TEMP/camper-action-smoke/.search-state/history.json" "$RUNNER_TEMP/camper-action-smoke-downloaded/.search-state/history.json"

  restore-artifact-across-jobs:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Restore hidden history in a different job
        uses: ./.github/actions/download-artifact
        env:
          NODE_OPTIONS: --throw-deprecation
        with:
          name: action-runtime-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/camper-history-restore
      - name: Verify restored history payload
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'camper-history-restore/.search-state/history.json'
          assert json.loads(path.read_text()) == {'probe': 'node24-artifact-roundtrip'}
          PY
