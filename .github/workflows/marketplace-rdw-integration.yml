name: Marketplace discovery and RDW integration (development only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'discover_listings.py'
      - 'listing_evidence.py'
      - 'browser_render.py'
      - 'test_listing_evidence.py'
      - 'test_browser_render.py'
      - 'camper_pipeline.py'
      - 'rdw_lookup.py'
      - 'rdw_probe_report.py'
      - 'test_discover_listings.py'
      - 'test_camper_pipeline.py'
      - '.github/workflows/marketplace-rdw-integration.yml'
permissions:
  contents: read
concurrency:
  group: camper-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and regression tests
        run: |
          python3 -m compileall -q discover_listings.py listing_evidence.py browser_render.py camper_pipeline.py rdw_lookup.py rdw_probe_report.py send_report.py
          python3 -m unittest -v test_discover_listings.py test_listing_evidence.py test_browser_render.py test_camper_pipeline.py test_mail_routing.py
      - name: Attempt ten-source direct marketplace discovery
        run: python3 discover_listings.py --output discovered_candidates.json
      - name: Screen discovered listings and check confirmed plates with RDW
        run: python3 camper_pipeline.py --input discovered_candidates.json
      - name: Live RDW API connectivity probe on historical test plate
        shell: bash
        run: |
          set +e
          python3 rdw_lookup.py V-706-SG --output rdw_probe.json
          code=$?
          set -e
          echo "RDW lookup exit code: $code"
          python3 rdw_probe_report.py rdw_probe.json
      - name: Store audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-rdw-verification-${{ github.run_id }}
          path: |
            discovered_candidates.json
            screening_results.json
            rdw_probe.json
            report.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Email development report ONLY to Hotmail
        if: github.event_name == 'workflow_dispatch'
        env:
          MAIL_MODE: development
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 send_report.py report.txt
      - name: Enforce discovery acceptance criteria after report delivery
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("discovered_candidates.json").read_text(encoding="utf-8"))
          count=len(data.get("candidates",[]))
          if count==0:
              raise SystemExit("DISCOVERY NOT VERIFIED: no usable individual listings; development report delivered but end-to-end validation FAILED")
          print("Individual candidate pages retrieved:",count)
          PY
