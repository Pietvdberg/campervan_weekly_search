name: Marketplace discovery and RDW integration (development only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'dealer_registry.json'
      - 'variant_research.json'
      - '.github/workflows/marketplace-rdw-integration.yml'
permissions:
  contents: read
concurrency:
  group: camper-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      state_ready: ${{ steps.stage_state.outcome }}
    steps:
      - uses: actions/checkout@v7
      - name: Check syntax and regression tests
        run: |
          python3 -m compileall -q .
          python3 -m unittest discover -v
      - name: Restore durable listing and coverage history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 state_store.py pull --repo "$GITHUB_REPOSITORY"
      - name: Attempt six-source direct marketplace discovery
        run: python3 discover_listings.py --output discovered_candidates.json
      - name: Screen discovered listings and check confirmed plates with RDW
        run: python3 camper_pipeline.py --input discovered_candidates.json --history .search-state/search_state.json --run-id "${{ github.run_id }}"
      - name: Validate screening invariants and stage outcomes
        id: validate
        run: python3 validate_search.py --discovery discovered_candidates.json --screening screening_results.json
      - name: Summarize durable coverage and shortlist changes
        run: python3 coverage_report.py
      - name: Live RDW API connectivity probe on historical test plate
        shell: bash
        run: |
          set +e
          python3 rdw_lookup.py V-706-SG --output rdw_probe.json
          code=$?
          set -e
          echo "RDW lookup exit code: $code"
          python3 rdw_probe_report.py rdw_probe.json
      - name: Store audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marketplace-rdw-verification-${{ github.run_id }}
          overwrite: true
          path: |
            discovered_candidates.json
            screening_results.json
            research_pack.json
            validation_summary.json
            reviewed_evidence_template.json
            rdw_probe.json
            report.txt
            coverage_health.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stage durable state for isolated persistence job
        id: stage_state
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: search-state-${{ github.run_id }}
          overwrite: true
          path: .search-state/
          include-hidden-files: true
          retention-days: 7
      - name: Restore mail submission state on rerun
        if: github.run_attempt > 1 && github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: mail-delivery-state-${{ github.run_id }}
          path: .
      - name: Email development report ONLY to Hotmail
        if: github.event_name == 'workflow_dispatch'
        env:
          MAIL_MODE: development
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 send_report.py report.txt
      - name: Preserve mail submission state
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: mail-delivery-state-${{ github.run_id }}
          path: mail_delivery_state.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - name: Require identity-bound discovery evidence and report coverage gaps
        run: python3 verify_discovery.py discovered_candidates.json

  persist-history:
    if: always() && needs.verify.outputs.state_ready == 'success'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: search-state-${{ github.run_id }}
          path: .search-state
      - name: Persist history without touching main or dispatching workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 state_store.py push --repo "$GITHUB_REPOSITORY"
