name: Marketplace discovery and RDW integration (development only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'src/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.github/actions/**'
      - '.github/workflows/marketplace-rdw-integration.yml'
permissions:
  contents: read
concurrency:
  group: camper-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      state_ready: ${{ steps.stage_state.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Check syntax and regression tests
        run: |
          python3 -m compileall -q .
          python3 -m unittest discover -s tests -t . -v
      - name: Restore durable listing and coverage history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m campervan_search.state_store pull --repo "$GITHUB_REPOSITORY"
      - name: Attempt six-source direct marketplace discovery
        run: python3 -m campervan_search.discover_listings --output discovered_candidates.json
      - name: Assess all unverified Pi RSS leads
        run: python3 -m campervan_search.rss_evaluation --input discovered_candidates.json --output rss_evaluation.json
      - name: Screen discovered listings and check confirmed plates with RDW
        run: python3 -m campervan_search.camper_pipeline --input discovered_candidates.json --rss-evaluation rss_evaluation.json --history .search-state/search_state.json --run-id "${{ github.run_id }}"
      - name: Validate screening invariants and stage outcomes
        id: validate
        run: python3 -m campervan_search.validate_search --discovery discovered_candidates.json --screening screening_results.json
      - name: Summarize durable coverage and shortlist changes
        run: python3 -m campervan_search.coverage_report
      - name: Live RDW API connectivity probe on historical test plate
        shell: bash
        run: |
          set +e
          python3 -m campervan_search.rdw_lookup V-706-SG --output rdw_probe.json
          code=$?
          set -e
          echo "RDW lookup exit code: $code"
          python3 -m campervan_search.rdw_probe_report rdw_probe.json
      - name: Store audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marketplace-rdw-verification-${{ github.run_id }}
          overwrite: true
          path: |
            discovered_candidates.json
            screening_results.json
            research_pack.json
            rss_evaluation.json
            validation_summary.json
            reviewed_evidence_template.json
            rdw_probe.json
            report.txt
            coverage_health.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stage durable state for isolated persistence job
        id: stage_state
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: search-state-${{ github.run_id }}
          overwrite: true
          path: .search-state/
          include-hidden-files: true
          retention-days: 7
      - name: Require identity-bound discovery evidence and report coverage gaps
        run: python3 -m campervan_search.verify_discovery discovered_candidates.json

  deliver-development:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: weekly-delivery-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Restore validated search audit
        uses: ./.github/actions/download-artifact
        with:
          name: marketplace-rdw-verification-${{ github.run_id }}
          path: .
      - name: Send development digest with durable recovery and acknowledgement
        env:
          MAIL_MODE: development
          GH_TOKEN: ${{ github.token }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 -m campervan_search.weekly_delivery send --repo "$GITHUB_REPOSITORY" --period "development-$GITHUB_RUN_ID"

  persist-history:
    if: always() && needs.verify.outputs.state_ready == 'success'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - uses: ./.github/actions/download-artifact
        with:
          name: search-state-${{ github.run_id }}
          path: .search-state
      - name: Persist history without touching main or dispatching workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m campervan_search.state_store push --repo "$GITHUB_REPOSITORY"
