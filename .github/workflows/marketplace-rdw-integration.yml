name: Marketplace discovery and RDW integration (development only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'discover_listings.py'
      - 'source_catalog.py'
      - 'listing_identity.py'
      - 'source_access.py'
      - 'conversion_evidence.py'
      - 'verify_discovery.py'
      - 'vehicle_risks.py'
      - 'autowereld_html.py'
      - 'autowereld_snapshot.py'
      - 'autowereld_upload.py'
      - 'scripts/install_autowereld_pi.sh'
      - 'test_autowereld_snapshot.py'
      - 'test_autowereld_html.py'
      - 'marketplace_links.py'
      - 'test_marketplace_links.py'
      - 'inventory_discovery.py'
      - 'test_inventory_discovery.py'
      - 'listing_evidence.py'
      - 'browser_render.py'
      - 'test_listing_evidence.py'
      - 'report_html.py'
      - 'test_report_html.py'
      - 'send_report.py'
      - 'test_browser_render.py'
      - 'camper_pipeline.py'
      - 'rdw_lookup.py'
      - 'rdw_probe_report.py'
      - 'test_discover_listings.py'
      - 'test_camper_pipeline.py'
      - '.github/workflows/marketplace-rdw-integration.yml'
permissions:
  contents: read
concurrency:
  group: camper-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and regression tests
        run: |
          python3 -m compileall -q .
          python3 -m unittest discover -v
      - name: Attempt six-source direct marketplace discovery
        run: python3 discover_listings.py --output discovered_candidates.json
      - name: Screen discovered listings and check confirmed plates with RDW
        run: python3 camper_pipeline.py --input discovered_candidates.json
      - name: Live RDW API connectivity probe on historical test plate
        shell: bash
        run: |
          set +e
          python3 rdw_lookup.py V-706-SG --output rdw_probe.json
          code=$?
          set -e
          echo "RDW lookup exit code: $code"
          python3 rdw_probe_report.py rdw_probe.json
      - name: Store audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-rdw-verification-${{ github.run_id }}
          path: |
            discovered_candidates.json
            screening_results.json
            rdw_probe.json
            report.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Restore mail submission state on rerun
        if: github.run_attempt > 1 && github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: mail-delivery-state-${{ github.run_id }}
          path: .
      - name: Email development report ONLY to Hotmail
        if: github.event_name == 'workflow_dispatch'
        env:
          MAIL_MODE: development
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 send_report.py report.txt
      - name: Preserve mail submission state
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mail-delivery-state-${{ github.run_id }}
          path: mail_delivery_state.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - name: Require identity-bound discovery evidence and report coverage gaps
        run: python3 verify_discovery.py discovered_candidates.json
