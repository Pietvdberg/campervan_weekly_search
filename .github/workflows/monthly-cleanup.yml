name: Monthly result retention cleanup

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview without moving or deleting files'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: monthly-result-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preview retention actions
        run: python3 cleanup_results.py
      - name: Apply retention actions
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          python3 cleanup_results.py --apply
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: monthly results retention cleanup"
          git pull --rebase origin main
          git push origin HEAD:main
