name: RDW vehicle and APK checks

on:
  workflow_dispatch:
    inputs:
      plates:
        description: 'Confirmed Dutch registration plates, separated by spaces or commas'
        required: true
        type: string

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Query official RDW datasets
        env:
          INPUT_PLATES: ${{ inputs.plates }}
        shell: bash
        run: |
          plates="${INPUT_PLATES//,/ }"
          read -r -a plate_array <<< "$plates"
          if [[ "${#plate_array[@]}" -eq 0 ]]; then
            echo "No registration plates supplied" >&2
            exit 1
          fi
          python3 rdw_lookup.py "${plate_array[@]}" --output rdw_results.json
      - name: Upload RDW results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdw-results-${{ github.run_id }}
          path: rdw_results.json
          if-no-files-found: warn
          retention-days: 30
