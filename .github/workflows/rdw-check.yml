name: RDW vehicle and APK checks

on:
  push:
    paths:
      - 'requests/*.txt'
  workflow_dispatch:
    inputs:
      plates:
        description: 'Confirmed Dutch registration plates, separated by spaces or commas'
        required: true
        type: string

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Resolve input
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATES: ${{ inputs.plates }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^requests/[^/]+\.txt$' || true)
            if [[ "${#changed[@]}" -ne 1 ]]; then
              echo "Expected exactly one changed request file" >&2
              exit 1
            fi
            request="${changed[0]}"
            key="${request#requests/}"
            key="${key%.txt}"
            if [[ ! "$key" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-zA-Z0-9_-]+)?$ ]]; then
              echo "Invalid request filename" >&2
              exit 1
            fi
            cp "$request" plates.txt
          else
            key="manual-$GITHUB_RUN_ID"
            printf '%s\n' "$INPUT_PLATES" > plates.txt
          fi
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - name: Query RDW
        shell: bash
        run: |
          raw="$(cat plates.txt)"
          raw="${raw//,/ }"
          read -r -a plates <<< "$raw"
          if [[ "${#plates[@]}" -eq 0 ]]; then
            echo "No plates supplied" >&2
            exit 1
          fi
          python3 rdw_lookup.py "${plates[@]}" --output rdw_results.json
      - name: Upload JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdw-results-${{ github.run_id }}
          path: rdw_results.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish result in repository
        if: success() && github.event_name == 'push'
        env:
          RESULT_KEY: ${{ steps.request.outputs.key }}
        shell: bash
        run: |
          mkdir -p results
          cp rdw_results.json "results/$RESULT_KEY.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "results/$RESULT_KEY.json"
          git commit -m "Add RDW result for $RESULT_KEY"
          git push
