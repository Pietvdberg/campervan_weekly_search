name: Weekly camper search and delivery
on:
  workflow_dispatch:
  schedule:
    # Amsterdam 15:00 is 13:00 UTC in summer and 14:00 UTC in winter.
    # weekly_schedule.py selects exactly one trigger for the local date.
    - cron: '0 13 * * 4'
    - cron: '0 14 * * 4'
permissions:
  contents: read
concurrency:
  group: weekly-delivery-${{ github.event_name == 'schedule' && 'production' || 'development' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      mode: ${{ steps.plan.outputs.mode }}
      period: ${{ steps.plan.outputs.period }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - id: plan
        name: Resolve audience and reporting period
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m campervan_search.weekly_schedule

  search:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      MAIL_MODE: ${{ needs.plan.outputs.mode }}
      DELIVERY_PERIOD: ${{ needs.plan.outputs.period }}
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Check syntax and regression tests
        run: |
          python3 -m compileall -q .
          python3 -m unittest discover -s tests -t . -v
      - name: Recover the original pending email before any fresh search
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 -m campervan_search.weekly_delivery recover --repo "$GITHUB_REPOSITORY" --period "$DELIVERY_PERIOD"
      - name: Restore observation history
        if: steps.recovery.outputs.already-delivered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m campervan_search.state_store pull --repo "$GITHUB_REPOSITORY" --branch "search-observations-$MAIL_MODE"
      - name: Discover current adverts and assess every RSS item
        if: steps.recovery.outputs.already-delivered != 'true'
        run: |
          python3 -m campervan_search.discover_listings --output discovered_candidates.json
          python3 -m campervan_search.rss_evaluation --input discovered_candidates.json --output rss_evaluation.json
          python3 -m campervan_search.camper_pipeline --input discovered_candidates.json --rss-evaluation rss_evaluation.json --history .search-state/search_state.json --run-id "$GITHUB_RUN_ID"
      - name: Require valid evidence and core discovery before delivery
        if: steps.recovery.outputs.already-delivered != 'true'
        run: |
          python3 -m campervan_search.validate_search --discovery discovered_candidates.json --screening screening_results.json
          python3 -m campervan_search.verify_discovery discovered_candidates.json
          python3 -m campervan_search.coverage_report
      - name: Persist observations independently of email acknowledgement
        if: steps.recovery.outputs.already-delivered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m campervan_search.state_store push --repo "$GITHUB_REPOSITORY" --branch "search-observations-$MAIL_MODE"
      - name: Deliver the digest with durable checkpoints
        if: steps.recovery.outputs.already-delivered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 -m campervan_search.weekly_delivery send --repo "$GITHUB_REPOSITORY" --period "$DELIVERY_PERIOD"
      - name: Preserve search and delivery audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-search-${{ github.run_id }}
          overwrite: true
          retention-days: 30
          if-no-files-found: warn
          path: |
            discovered_candidates.json
            screening_results.json
            rss_evaluation.json
            research_pack.json
            validation_summary.json
            coverage_health.json
            report.txt
            delivery_report.txt
            delivery_report.html
            delivery_receipt.json

  notify-failure:
    needs: [plan, search]
    if: always() && (needs.plan.result == 'failure' || needs.search.result == 'failure' || needs.search.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Notify owner by email, with a GitHub issue fallback
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 -m campervan_search.failure_alert
