name: Camper pipeline verification (development only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and regression tests
        run: |
          python3 -m compileall -q camper_pipeline.py rdw_lookup.py send_report.py
          python3 -m unittest -v test_camper_pipeline.py test_mail_routing.py
      - name: Evaluate candidates and perform RDW checks for confirmed plates
        run: python3 camper_pipeline.py --input candidates.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camper-pipeline-verification-${{ github.run_id }}
          path: |
            screening_results.json
            report.txt
          if-no-files-found: warn
      - name: Restore mail submission state on rerun
        if: github.run_attempt > 1
        uses: actions/download-artifact@v4
        with:
          name: mail-delivery-state-${{ github.run_id }}
          path: .
      - name: Send verification report to Hotmail ONLY
        env:
          MAIL_MODE: development
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 send_report.py report.txt
      - name: Preserve mail submission state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-delivery-state-${{ github.run_id }}
          path: mail_delivery_state.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
